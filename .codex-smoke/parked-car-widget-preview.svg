      <text x="710" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#78AACC">save your parking spot</text>
    </g>

    <text x="552" y="319" font-family="Arial, sans-serif" font-size="13" fill="#AABBD0">No parked location saved yet</text>
  </g>

  <text x="68" y="458" font-family="Arial, sans-serif" font-size="14" fill="#475467">Actual launcher rendering may vary a little by device and home-screen grid size.</text>
</svg>
