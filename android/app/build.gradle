apply plugin: 'com.android.application'

def physicalHVariantsEnabled = providers.gradleProperty("physicalHVariants")
    .map { it.toBoolean() }
    .orElse(false)
    .get()
def physicalHApprovedAndroidIdsRaw = providers.gradleProperty("physicalHApprovedAndroidIds")
    .orElse("")
    .get()
    .trim()
def physicalHApprovedAndroidIdValues = physicalHApprovedAndroidIdsRaw.isEmpty()
    ? []
    : physicalHApprovedAndroidIdsRaw.split("[,;\\r\\n]+")
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
if (!physicalHApprovedAndroidIdValues.isEmpty()
        && (physicalHApprovedAndroidIdValues.size() != 1
            || !(physicalHApprovedAndroidIdValues[0] ==~ /[0-9a-f]{16}/))) {
    throw new GradleException(
        "Physical H approved ANDROID_ID input must be empty or exactly one canonical lowercase 16-hex identity"
    )
}
def physicalHApprovedAndroidIds = physicalHApprovedAndroidIdValues.join(",")
    .replace("\\", "\\\\")
    .replace('"', '\\"')

android {
    namespace = "com.drivesense.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.drivesense.app"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 3
        versionName = "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Physical H variants are deliberately opt-in. Normal production/debug
    // configuration therefore keeps its existing unflavoured task names and
    // package identity. The reviewed harness build uses:
    //   -PphysicalHVariants=true
    if (physicalHVariantsEnabled) {
        flavorDimensions += "physicalHarness"
        productFlavors {
            physicalH {
                dimension "physicalHarness"
                applicationIdSuffix ".p35h"
                versionNameSuffix "-physical-h"
                signingConfig signingConfigs.debug
                buildConfigField "boolean", "PHYSICAL_H_BUILD", "true"
                buildConfigField "boolean", "PHYSICAL_H_LEGACY_BUILD", "false"
                buildConfigField "String", "PHYSICAL_H_APPROVED_ANDROID_IDS", "\"${physicalHApprovedAndroidIds}\""
            }
            physicalHLegacy {
                dimension "physicalHarness"
                applicationIdSuffix ".p35h"
                versionCode = 2
                versionNameSuffix "-physical-h-legacy"
                signingConfig signingConfigs.debug
                buildConfigField "boolean", "PHYSICAL_H_BUILD", "true"
                buildConfigField "boolean", "PHYSICAL_H_LEGACY_BUILD", "true"
                buildConfigField "String", "PHYSICAL_H_APPROVED_ANDROID_IDS", "\"${physicalHApprovedAndroidIds}\""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    sourceSets {
        test {
            resources.srcDirs += ["../../src/lib/__fixtures__", "../../src/lib/__tests__/goldenFixtures"]
        }
        androidTest {
            assets.srcDirs += ["../../src/lib/__fixtures__", "../../src/lib/__tests__/goldenFixtures"]
        }
        if (physicalHVariantsEnabled) {
            // The Physical H test APK is a reviewed guarded harness, not a
            // bundle of every historical instrumentation test. This prevents
            // an ordinary destructive androidTest class from becoming an
            // alternate unguarded entry point in com.drivesense.app.p35h.test.
            androidTest.java.setSrcDirs([])
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            File filesystemRoot = rootProject.projectDir.toPath().getRoot().toFile()
            File robolectricShortTempRoot = new File(filesystemRoot, "tmp/rs-robolectric")
            robolectricShortTempRoot.mkdirs()
            systemProperty "java.io.tmpdir", robolectricShortTempRoot.absolutePath
        }
    }
}

def webProjectDir = file("../..")
def androidPublicAssetsDir = file("src/main/assets/public")
def npmCommand = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? "npm.cmd" : "npm"

tasks.register("drivesenseBuildWeb", Exec) {
    group = "drivesense"
    description = "Builds the current Vite web app before Android packaging."
    workingDir webProjectDir
    // The opt-in Physical H artifact exercises the reviewed native-authority
    // projection path. Normal production builds keep Vite's default OFF.
    if (physicalHVariantsEnabled) {
        environment "VITE_P35_NATIVE_AUTHORITY", "true"
    }
    commandLine npmCommand, "run", "build"
    // The Physical H flag changes the bundle that Vite emits, but Gradle does
    // not treat Exec.environment as a task input. Without this property a dist
    // produced by a non-Physical-H build satisfies the up-to-date check and is
    // packaged verbatim, silently shipping a bundle with native authority off.
    inputs.property("physicalHVariants", physicalHVariantsEnabled)
    inputs.files(
        fileTree("${webProjectDir}/src"),
        "${webProjectDir}/index.html",
        "${webProjectDir}/package.json",
        "${webProjectDir}/package-lock.json",
        "${webProjectDir}/vite.config.js",
        "${webProjectDir}/tailwind.config.js",
        "${webProjectDir}/postcss.config.js"
    )
    outputs.dir("${webProjectDir}/dist")
}

tasks.register("drivesenseSyncWebAssets", Sync) {
    group = "drivesense"
    description = "Copies the freshly built web app into Capacitor's Android assets."
    dependsOn tasks.named("drivesenseBuildWeb")
    from "${webProjectDir}/dist"
    into androidPublicAssetsDir
}

preBuild.dependsOn tasks.named("drivesenseSyncWebAssets")

if (physicalHVariantsEnabled) {
    tasks.register("verifyPhysicalHUpgradeArtifacts", Exec) {
        group = "verification"
        description = "Verifies Physical H current/legacy package, signing certificate, and upgrade ordering."
        dependsOn "assemblePhysicalHDebug", "assemblePhysicalHDebugAndroidTest", "assemblePhysicalHLegacyDebug"
        workingDir webProjectDir
        commandLine "node", "scripts/verify-physical-h-upgrade.mjs",
            "--apk-root", file("build/outputs/apk").absolutePath,
            "--expected-package", "com.drivesense.app.p35h",
            "--report", file("build/reports/physical-h/upgrade-artifacts.json").absolutePath
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.camera:camera-camera2:1.6.1"
    implementation "androidx.camera:camera-core:1.6.1"
    implementation "androidx.camera:camera-lifecycle:1.6.1"
    implementation "androidx.camera:camera-view:1.6.1"
    // Bundled variant: OCR remains available without a network connection.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // Portable P3.5 backups require a memory-hard, independently recoverable
    // passphrase KDF. Argon2Kt ships the audited Argon2 implementation for
    // Android (including 16 KiB page-size support in 1.6.0).
    implementation "com.lambdapioneer.argon2kt:argon2kt:1.6.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
