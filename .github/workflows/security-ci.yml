name: Security CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check promotion blocker JSDoc
        run: npm run calibration:check-promotion-blockers

      - name: Evaluate calibration validation gate
        id: calibration_gate
        run: node scripts/evaluate-calibration-gate.mjs

      - name: Validate promoted calibration constants
        if: steps.calibration_gate.outputs.should_validate == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run calibration:validate 2>&1 | tee calibration-report.txt

      - name: Upload calibration report
        if: always() && steps.calibration_gate.outputs.should_validate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calibration-report
          path: calibration-report.txt

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Audit all dependencies for critical CVEs
        run: npm audit --audit-level=critical

      - name: Block react-quill source imports
        run: |
          if grep -R "react-quill" src; then
            echo "react-quill must not be imported from application source."
            exit 1
          fi

      - name: Check repository hygiene
        run: npm run check:repo-hygiene

      - name: Check certificate pin expiry dates
        run: python3 scripts/check_pin_expiry.py android/app/src/main/res/xml/network_security_config.xml 60

      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke e2e
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Verify debug routes are absent from production bundle
        run: |
          if grep -rE '"/diagnostics"|path:"/diagnostics"|Tracking Diagnostics|diagnostics-trips|native_diagnostics_clear' dist/assets/*.js 2>/dev/null; then
            echo "ERROR: Diagnostics route found in production bundle!"
            exit 1
          fi
          echo "OK: No debug routes in production bundle."

      - name: Block localhost API fallback in production bundle
        run: |
          if grep -R "http://localhost:5000/api" dist; then
            echo "Production bundle must not contain a localhost API fallback."
            exit 1
          fi

  live-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test live Overpass, Open-Meteo, and OSRM contracts
        run: npm run test:contracts:live

  android-instrumentation:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Enable Gradle wrapper
        run: chmod +x android/gradlew

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
